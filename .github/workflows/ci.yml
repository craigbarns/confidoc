name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint (informational)
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_SHA="$(git merge-base HEAD origin/main)"
          else
            BASE_SHA="HEAD"
          fi
          CHANGED_PY="$(git diff --name-only "$BASE_SHA" HEAD | grep -E '^(app|tests|scripts)/.*\.py$' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files; skipping Ruff lint."
            exit 0
          fi
          echo "Changed Python files:"
          echo "$CHANGED_PY"
          # Lint is informational while legacy debt (F401, etc.) is cleaned
          # progressively; formatting is enforced below.
          # shellcheck disable=SC2086
          ruff check $CHANGED_PY || echo "::warning::Ruff lint findings — non-blocking, progressive cleanup"
      - name: Ruff format check (enforced)
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_SHA="$(git merge-base HEAD origin/main)"
          else
            BASE_SHA="HEAD"
          fi
          CHANGED_PY="$(git diff --name-only "$BASE_SHA" HEAD | grep -E '^(app|tests|scripts)/.*\.py$' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files; skipping Ruff format check."
            exit 0
          fi
          # shellcheck disable=SC2086
          ruff format --check $CHANGED_PY

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: confidoc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d confidoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/confidoc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate golden sets JSON
        run: python scripts/validate_golden_sets.py golden/golden_sets.minimal.json
      - name: Pytest with coverage
        run: python -m pytest tests/ -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=30

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for hardcoded default secrets
        run: |
          set -euo pipefail
          out=$(grep -rn "CHANGE-ME" app/ --include="*.py" | grep -v '^app/config\.py:' || true)
          if [ -n "${out}" ]; then
            echo "${out}"
            echo "::error::Found CHANGE-ME placeholders outside app/config.py"
            exit 1
          fi

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t confidoc-backend:latest .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'confidoc-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
