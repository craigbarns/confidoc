name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_SHA="$(git merge-base HEAD origin/main)"
          else
            BASE_SHA="HEAD"
          fi
          CHANGED_PY="$(git diff --name-only "$BASE_SHA" HEAD -- 'app/**/*.py' 'tests/**/*.py' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files in app/tests; skipping Ruff lint."
            exit 0
          fi
          echo "Changed Python files:"
          echo "$CHANGED_PY"
          # shellcheck disable=SC2086
          ruff check $CHANGED_PY
      - name: Ruff format check
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_SHA="$(git merge-base HEAD origin/main)"
          else
            BASE_SHA="HEAD"
          fi
          CHANGED_PY="$(git diff --name-only "$BASE_SHA" HEAD -- 'app/**/*.py' 'tests/**/*.py' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files in app/tests; skipping Ruff format check."
            exit 0
          fi
          # shellcheck disable=SC2086
          ruff format --check $CHANGED_PY

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate golden sets JSON
        run: python scripts/validate_golden_sets.py golden/golden_sets.minimal.json
      - name: Pytest with coverage
        run: python -m pytest tests/ -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=30

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check for hardcoded secrets
        run: |
          # Fail if production-default secrets found in committed code
          ! grep -rn "CHANGE-ME" app/ --include="*.py" | grep -v config.py | grep -v "CHANGE-ME" || true
