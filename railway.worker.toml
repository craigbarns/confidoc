# Railway configuration for the Celery worker service.
# In the Railway dashboard, set this service's configPath to "railway.worker.toml".
# This forces Railway to use the Dockerfile builder and never invoke Railpack.

[build]
builder = "dockerfile"
dockerfilePath = "docker/Dockerfile.worker"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
